<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简社交 V5.7</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --pk: #FF6699; --pk-bg: #fff0f5; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, sans-serif; background: #fff; color: #0f1419; overflow-x: hidden; }
        .app { max-width: 600px; margin: 0 auto; min-height: 100vh; padding-bottom: 60px; border: 1px solid #eee; position: relative; }
        .hd { padding: 14px 15px; border-bottom: 1px solid #eee; font-size: 20px; font-weight: 800; position: sticky; top: 0; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); z-index: 10; display: flex; align-items: center; justify-content: space-between; }

        /* avatar */
        .av { border-radius: 50%; overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; background: var(--pk-bg); background-size: cover; background-position: center; }

        /* compose */
        .compose { padding: 15px; border-bottom: 1px solid #eee; display: flex; gap: 12px; }
        .compose-main { flex: 1; min-width: 0; }
        .compose-input { width: 100%; border: none; outline: none; font-size: 18px; resize: none; min-height: 50px; }
        .pre-grid { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .pre-wrap { position: relative; }
        .pre-thumb { width: 90px; height: 90px; object-fit: cover; border-radius: 10px; display: block; }
        .pre-del { position: absolute; top: 3px; right: 3px; background: rgba(0,0,0,0.55); color: #fff; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; line-height: 1; }
        .compose-tools { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }

        /* posts */
        .post { border-bottom: 1px solid #eee; padding: 15px; display: flex; gap: 12px; transition: background 0.6s; }
        .post.hl { background: var(--pk-bg); }
        .post-body { flex: 1; min-width: 0; }
        .post-meta { font-weight: 800; font-size: 15px; cursor: pointer; }
        .post-meta:hover { color: var(--pk); }
        .post-content { font-size: 15px; line-height: 1.5; margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
        .imgs-1 { margin-top: 10px; }
        .imgs-1 img { width: 100%; max-height: 360px; object-fit: cover; border-radius: 14px; border: 1px solid #f0f0f0; }
        .imgs-2, .imgs-3 { display: grid; gap: 3px; margin-top: 10px; border-radius: 14px; overflow: hidden; }
        .imgs-2 { grid-template-columns: 1fr 1fr; }
        .imgs-3 { grid-template-columns: 1fr 1fr; }
        .imgs-3 img:first-child { grid-column: span 2; height: 200px; }
        .imgs-2 img, .imgs-3 img { width: 100%; height: 180px; object-fit: cover; display: block; }
        .post-actions { display: flex; justify-content: space-between; margin-top: 12px; color: #536471; }
        .action { display: flex; align-items: center; gap: 4px; cursor: pointer; font-size: 13px; padding: 4px 2px; transition: color 0.2s; }
        .action svg { width: 17px; height: 17px; fill: currentColor; flex-shrink: 0; }
        .action:hover { color: var(--pk); }
        .action.liked { color: var(--pk); }
        .action.del { color: #ddd; }
        .action.del:hover { color: #f44; }

        /* profile */
        .profile-box { padding: 20px; text-align: center; border-bottom: 1px solid #eee; }
        .meta-info { font-size: 14px; color: var(--pk); margin: 12px 0; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .meta-tag { background: var(--pk-bg); padding: 5px 12px; border-radius: 12px; cursor: pointer; user-select: none; }
        .meta-tag:hover { filter: brightness(0.95); }

        /* popup menus */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; z-index: 1000; align-items: center; justify-content: center; }
        .menu-box { background: #fff; width: 84%; max-width: 320px; border-radius: 18px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .menu-hd { padding: 14px 16px; font-weight: bold; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; font-size: 15px; }
        .menu-back { color: var(--pk); cursor: pointer; font-size: 13px; min-width: 40px; }
        .menu-scroll { max-height: 380px; overflow-y: auto; }
        .menu-section-lbl { padding: 6px 16px; font-size: 11px; color: #aaa; background: #f9f9f9; }
        .menu-item { padding: 14px 16px; text-align: center; border-bottom: 1px solid #f2f2f2; cursor: pointer; font-size: 15px; }
        .menu-item:hover { background: var(--pk-bg); }
        .menu-item.cancel { color: var(--pk); font-weight: bold; border-bottom: none; }

        /* bottom nav */
        .bnav { position: fixed; bottom: 0; width: 100%; max-width: 600px; display: flex; background: #fff; border-top: 1px solid #eee; height: 55px; }
        .ni { flex: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #c0c8d0; transition: color 0.2s; }
        .ni.active { color: var(--pk); }
        .ni svg { width: 26px; height: 26px; fill: currentColor; }

        /* buttons */
        .btn-pk { background: var(--pk); color: #fff; border: none; padding: 8px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .btn-ghost { background: #fff; border: 1px solid #ddd; padding: 6px 16px; border-radius: 20px; cursor: pointer; }
        .btn-blk { width: 100%; background: #111; color: #fff; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; }
        .ef { width: 100%; padding: 10px; border: 1px solid #eee; border-radius: 8px; font-size: 15px; margin-bottom: 10px; }
        textarea.ef { resize: none; min-height: 70px; }

        /* comment badge */
        .badge-host { background: var(--pk); color: #fff; font-size: 10px; padding: 1px 5px; border-radius: 4px; margin-left: 5px; vertical-align: middle; }

        /* views */
        .view { display: none; }
        .view.active { display: block; }
        .empty { padding: 40px; text-align: center; color: #bbb; font-size: 15px; }

        /* reply modal */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; z-index: 200; align-items: flex-end; }
        .modal-body { background: #fff; width: 100%; max-width: 600px; height: 82vh; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; margin: 0 auto; }
        .modal-hd { padding: 14px 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .modal-compose { display: flex; align-items: flex-end; gap: 10px; padding: 10px 15px; border-top: 1px solid #eee; flex-shrink: 0; }
        .modal-compose textarea { flex: 1; font-size: 16px; border: none; outline: none; resize: none; min-height: 40px; }

        /* user profile panel */
        #v-user { display: none; position: fixed; inset: 0; background: #fff; z-index: 150; max-width: 600px; left: 50%; transform: translateX(-50%); overflow-y: auto; padding-bottom: 60px; }
    </style>
</head>

const BD_YEARS = Array.from({length: 127}, (_, i) => 2026 - i); // 2026→1900
const BD_MONTHS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

// ── helpers ──────────────────────────────────────────
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function fmtBd(bd) {
    if (!bd) return '点击设生日';
    const [y,m,d] = bd.split('-').map(Number);
    return `${y}年${m}月${d}日`;
}

function daysInMonth(y,m) { return new Date(y,m,0).getDate(); }

function avColor(name) { return AVATAR_COLORS[(name||'?').charCodeAt(0) % AVATAR_COLORS.length]; }

function avStyle(name, avatarUrl, size) {
    if (avatarUrl) return `background-image:url('${avatarUrl}');background-size:cover;background-position:center;font-size:0;`;
    return `background:${avColor(name)};font-size:${Math.round(size*0.38)}px;`;
}

function avContent(name, avatarUrl) { return avatarUrl ? '' : esc((name||'?')[0]); }

function compressImage(file, maxPx=1000, q=0.78) {
    return new Promise(res => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
            URL.revokeObjectURL(url);
            const scale = Math.min(1, maxPx / Math.max(img.width, img.height));
            const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
            const cv = document.createElement('canvas');
            cv.width = w; cv.height = h;
            cv.getContext('2d').drawImage(img, 0, 0, w, h);
            res(cv.toDataURL('image/jpeg', q));
        };
        img.src = url;
    });
}

// ── my profile ───────────────────────────────────────
function renderMyProfile() {
    document.getElementById('p-name').innerText = my.name || '探索者';
    document.getElementById('p-bio').innerText = my.bio || '暂无个人简介';
    document.getElementById('p-city').innerText = '📍 ' + (my.region || '点击选城市');
    document.getElementById('p-const').innerText = '✨ ' + (my.constellation || '点击选星座');
    document.getElementById('p-birth').innerText = '🎂 ' + fmtBd(my.birthday);
    renderMyAv();
}

function renderMyAv() {
    const el = document.getElementById('my-av');
    const ini = document.getElementById('my-initial');
    if (my.avatar_url) {
        el.style.backgroundImage = `url('${my.avatar_url}')`;
        el.style.backgroundSize = 'cover';
        el.style.backgroundPosition = 'center';
        el.style.background = '';
        ini.innerText = '';
    } else {
        el.style.backgroundImage = '';
        el.style.background = avColor(my.name);
        ini.innerText = (my.name||'探')[0];
    }
    renderComposeAv();
}

function renderComposeAv() {
    const el = document.getElementById('compose-av');
    if (!el) return;
    if (my.avatar_url) {
        el.style.cssText = `width:48px;height:48px;font-size:0;background-image:url('${my.avatar_url}');background-size:cover;background-position:center;`;
        el.innerText = '';
    } else {
        el.style.cssText = `width:48px;height:48px;font-size:18px;background:${avColor(my.name)};`;

}

function openEditPanel() {
    document.getElementById('i-name').value = my.name || '';
    document.getElementById('i-bio').value = my.bio || '';
    document.getElementById('edit-panel').style.display = 'block';
}

async function saveProfile() {
    const up = { id:'me', name: document.getElementById('i-name').value.trim() || my.name, bio: document.getElementById('i-bio').value.trim() };
    const { error } = await db.from('profiles').upsert([up]);
    if (!error) { my = {...my,...up}; renderMyProfile(); document.getElementById('edit-panel').style.display='none'; }
    else alert('保存失败：'+error.message);
}

async function handleAvatarUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const b64 = await compressImage(file, 400, 0.8);
    my.avatar_url = b64;
    // Try to save to DB (requires avatar_url column to exist)
    await db.from('profiles').upsert([{ id:'me', avatar_url: b64 }]);
    renderMyAv();
}

// ── feed ─────────────────────────────────────────────
function renderImgs(imgUrl) {
    if (!imgUrl) return '';
    let arr;
    try { arr = JSON.parse(imgUrl); } catch { arr = [imgUrl]; }
    if (!Array.isArray(arr)) arr = [arr];
    arr = arr.filter(Boolean);
    if (!arr.length) return '';
    if (arr.length === 1) return `<div class="imgs-1"><img src="${esc(arr[0])}"></div>`;
    if (arr.length === 2) return `<div class="imgs-2">${arr.map(s=>`<img src="${esc(s)}">`).join('')}</div>`;
    return `<div class="imgs-3">${arr.slice(0,3).map(s=>`<img src="${esc(s)}">`).join('')}</div>`;
}

function postCard(p, cCount, myAvUrl) {
    const isOwn = p.author_id === 'me';
    const avS = isOwn ? avStyle(my.name, myAvUrl, 48) : `background:${avColor(p.author_name)};font-size:18px;`;
    const avC = isOwn ? avContent(my.name, myAvUrl) : esc((p.author_name||'?')[0]);
    return `<div class="post" id="post-${p.id}">
        <div class="av" style="width:48px;height:48px;${avS};cursor:pointer;" onclick="openUserView('${esc(p.author_id)}','${esc(p.author_name)}')">${avC}</div>
        <div class="post-body">
            <span class="post-meta" onclick="openUserView('${esc(p.author_id)}','${esc(p.author_name)}')">${esc(p.author_name)}</span>
            <div class="post-content">${esc(p.content)}</div>
            ${renderImgs(p.image_url)}
            <div class="post-actions">
                <div class="action" data-id="${p.id}" data-likes="${p.likes}" onclick="like(this)">
                    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    <span>${p.likes}</span>
                </div>
                <div class="action" onclick="openReply(${p.id},'${esc(p.author_id)}')">
                    <svg viewBox="0 0 24 24"><path d="M21.99 4c0-1.1-.89-2-1.99-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4-.01-18z"/></svg>
                    <span>${cCount}</span>
                </div>
                <div class="action" onclick="sharePost(${p.id})">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
                    <span>分享</span>
                </div>
                ${isOwn ? `<div class="action del" onclick="deletePost(${p.id})">
                    <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                    <span>删除</span>
                </div>` : ''}
            </div>
        </div>
    </div>`;
}

async function loadFeed(type, containerId) {
    let q = db.from('posts').select('*').order('created_at',{ascending:false});
    if (type === 'me') {
        q = q.eq('author_id','me');
    } else if (type === 'follow') {
        const ids = ['me', ...followed];
        q = q.in('author_id', ids);
    }

    const { data: posts } = await q;
    const { data: comms } = await db.from('comments').select('post_id');

    const cid = containerId || (type==='me'?'list-mine':type==='follow'?'list-follow':'list-all');
    const container = document.getElementById(cid);
    if (!posts || !posts.length) { container.innerHTML = '<div class="empty">暂无内容</div>'; return; }
    const counts = {};
    (comms||[]).forEach(c => counts[c.post_id] = (counts[c.post_id]||0)+1);
    container.innerHTML = posts.map(p => postCard(p, counts[p.id]||0, my.avatar_url)).join('');
}

async function like(el) {
    el.classList.toggle('liked');
    const isAdd = el.classList.contains('liked');
    const id = Number(el.dataset.id);
    const next = isAdd ? Number(el.dataset.likes)+1 : Math.max(0,Number(el.dataset.likes)-1);
    el.querySelector('span').innerText = next;
    el.dataset.likes = next;
    await db.from('posts').update({likes:next}).eq('id',id);
}

async function deletePost(id) {
    if (!confirm('确定删除这条动态吗？')) return;
    await db.from('comments').delete().eq('post_id',id);
    const { error } = await db.from('posts').delete().eq('id',id);
    if (!error) document.getElementById('post-'+id)?.remove();
}

async function sharePost(id) {
    const url = `${location.origin}${location.pathname}?post=${id}`;
    try { await navigator.clipboard.writeText(url); alert('链接已复制！'); }
    catch { prompt('复制以下链接：', url); }
}

// ── compose ───────────────────────────────────────────
async function handleFiles(e) {
    const remaining = 3 - postImgs.length;
    if (remaining <= 0) { alert('最多添加 3 张图片'); return; }
    const files = Array.from(e.target.files).slice(0, remaining);
    for (const f of files) {
        const b64 = await compressImage(f);
        postImgs.push(b64);
    }
    e.target.value = '';
    renderPreGrid();
}

function renderPreGrid() {
    document.getElementById('pre-grid').innerHTML = postImgs.map((src,i) =>
        `<div class="pre-wrap">
            <img class="pre-thumb" src="${src}">
            <div class="pre-del" onclick="removeImg(${i})">×</div>
        </div>`
    ).join('');
}

function removeImg(i) { postImgs.splice(i,1); renderPreGrid(); }

async function publish() {
    const txt = document.getElementById('inp-text').value.trim();
    if (!txt && !postImgs.length) return;
    const imgVal = postImgs.length ? JSON.stringify(postImgs) : null;
    const { error } = await db.from('posts').insert([{
        author_id:'me', author_name:my.name, content:txt, image_url:imgVal, likes:0
    }]);
    if (error) { alert('发帖失败：'+error.message); return; }
    document.getElementById('inp-text').value = '';
    postImgs = [];
    renderPreGrid();
    await loadFeed('all');
}

// ── star sign ─────────────────────────────────────────
function openConstMenu() { document.getElementById('menu-const').style.display='flex'; }
function closeConst() { document.getElementById('menu-const').style.display='none'; }
async function pickConst(name) {
    const { error } = await db.from('profiles').upsert([{id:'me',constellation:name}]);
    if (!error) { my.constellation=name; renderMyProfile(); }
    closeConst();
}

// ── city ─────────────────────────────────────────────
function openCityMenu() { selCountry=null; showCountries(); document.getElementById('menu-city').style.display='flex'; }
function closeCity() { document.getElementById('menu-city').style.display='none'; }

function showCountries() {
    selCountry=null;
    document.getElementById('city-title').innerText='选择国家';
    document.getElementById('city-back').style.display='none';
    document.getElementById('city-list').innerHTML =
        COUNTRIES.map(c=>`<div class="menu-item" onclick="showCities('${c.n}')">${c.f} ${c.n}</div>`).join('') +
        `<div class="menu-item cancel" onclick="closeCity()">取消</div>`;
}

function showCities(cName) {
    selCountry = COUNTRIES.find(c=>c.n===cName);
    document.getElementById('city-title').innerText = selCountry.f+' '+selCountry.n;
    document.getElementById('city-back').style.display='block';
    document.getElementById('city-list').innerHTML =
        selCountry.c.map(city=>`<div class="menu-item" onclick="pickCity('${city}')">${city}</div>`).join('') +
        `<div class="menu-item cancel" onclick="closeCity()">取消</div>`;
}

async function pickCity(city) {
    const val = selCountry ? selCountry.n+' · '+city : city;
    const { error } = await db.from('profiles').upsert([{id:'me', region:val}]);
    if (!error) { my.region=val; renderMyProfile(); }
    closeCity();
}

// ── birthday ─────────────────────────────────────────
function openBdMenu() { bdStep='year'; bdY=null; bdM=null; renderBd(); document.getElementById('menu-bd').style.display='flex'; }
function closeBd() { document.getElementById('menu-bd').style.display='none'; }

function bdBack() {
    if (bdStep==='day') { bdStep='month'; bdM=null; }
    else { bdStep='year'; bdY=null; }
    renderBd();
}

function renderBd() {
    const titles={year:'选择出生年份', month:`${bdY}年 · 选择月份`, day:`${bdY}年${bdM}月 · 选择日`};
    document.getElementById('bd-title').innerText = titles[bdStep];
    document.getElementById('bd-back').style.display = bdStep==='year'?'none':'block';
    let html='';
    if (bdStep==='year')  html = BD_YEARS.map(y=>`<div class="menu-item" onclick="bdYear(${y})">${y} 年</div>`).join('');
    else if (bdStep==='month') html = BD_MONTHS.map((m,i)=>`<div class="menu-item" onclick="bdMonth(${i+1})">${m}</div>`).join('');
    else html = Array.from({length:daysInMonth(bdY,bdM)},(_,i)=>i+1).map(d=>`<div class="menu-item" onclick="bdDay(${d})">${d} 日</div>`).join('');
    document.getElementById('bd-list').innerHTML = html + `<div class="menu-item cancel" onclick="closeBd()">取消</div>`;
}

function bdYear(y) { bdY=y; bdStep='month'; renderBd(); }
function bdMonth(m) { bdM=m; bdStep='day'; renderBd(); }
async function bdDay(d) {
    const val = `${bdY}-${String(bdM).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const { error } = await db.from('profiles').upsert([{id:'me', birthday:val}]);
    if (!error) { my.birthday=val; renderMyProfile(); }
    closeBd();
}

// ── user profile view ─────────────────────────────────
async function openUserView(uid, uname) {
    if (uid === 'me') { switchNav('me'); return; }
    viewingUid = uid;
    const panel = document.getElementById('v-user');
    document.getElementById('u-hd-name').innerText = uname;
    document.getElementById('u-name').innerText = '加载中…';
    document.getElementById('u-bio').innerText = '';
    document.getElementById('u-posts').innerHTML = '<div class="empty">加载中…</div>';
    updateFollowBtn();
    panel.style.display = 'block';
    document.body.style.overflow = 'hidden';

    const { data: prof } = await db.from('profiles').select('*').eq('id',uid).single();
    const av = document.getElementById('u-av');
    if (prof) {
        document.getElementById('u-name').innerText = prof.name || uname;
        document.getElementById('u-bio').innerText = prof.bio || '暂无个人简介';
        document.getElementById('u-city').innerText = '📍 '+(prof.region||prof.city||'未设置');
        document.getElementById('u-const').innerText = '✨ '+(prof.constellation||'未设置');
        document.getElementById('u-birth').innerText = '🎂 '+fmtBd(prof.birthday);
        if (prof.avatar_url) { av.style.cssText=`width:80px;height:80px;background-image:url('${prof.avatar_url}');background-size:cover;background-position:center;font-size:0;`; av.innerText=''; }
        else { av.style.cssText=`width:80px;height:80px;background:${avColor(prof.name||uname)};font-size:30px;`; av.innerText=(prof.name||uname)[0]; }
    }

    const { data: posts } = await db.from('posts').select('*').eq('author_id',uid).order('created_at',{ascending:false});
    const { data: comms } = await db.from('comments').select('post_id');
    if (!posts||!posts.length) { document.getElementById('u-posts').innerHTML='<div class="empty">TA 还没有发过帖子</div>'; return; }
    const counts={};
    (comms||[]).forEach(c=>counts[c.post_id]=(counts[c.post_id]||0)+1);
    document.getElementById('u-posts').innerHTML = posts.map(p=>postCard(p,counts[p.id]||0,null)).join('');
}

function closeUserView() {
    document.getElementById('v-user').style.display='none';
    document.body.style.overflow='';
    viewingUid=null;
}

function toggleFollow() {
    if (!viewingUid) return;
    const idx = followed.indexOf(viewingUid);
    if (idx>=0) followed.splice(idx,1); else followed.push(viewingUid);
    localStorage.setItem('followed', JSON.stringify(followed));
    updateFollowBtn();
}

function updateFollowBtn() {
    const btn = document.getElementById('u-follow-btn');
    const isF = followed.includes(viewingUid);
    btn.innerText = isF ? '已关注' : '关注';
    btn.style.cssText = isF
        ? 'font-size:13px;padding:5px 14px;background:#fff;color:var(--pk);border:1px solid var(--pk);border-radius:20px;cursor:pointer;'
        : 'font-size:13px;padding:5px 14px;';
    btn.className = isF ? '' : 'btn-pk';
}

// ── nav ───────────────────────────────────────────────
function switchNav(v) {
    document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
    document.querySelectorAll('.ni').forEach(el=>el.classList.remove('active'));
    const views={home:'v-home',follow:'v-follow',msg:'v-msg',me:'v-me'};
    const titles={home:'首页',follow:'动态',msg:'通知',me:'个人主页'};
    document.getElementById(views[v]).classList.add('active');
    document.getElementById('nav-'+v).classList.add('active');
    document.getElementById('title').innerText=titles[v];
    if (v==='follow') loadFeed('follow');
    if (v==='me') loadFeed('me');
}

// ── reply ─────────────────────────────────────────────
function openReply(id, authorId) {
    curPId=id; curPostAuthorId=authorId||null;
    document.getElementById('modal-reply').style.display='flex';
    renderReply();
}
function closeReply() { document.getElementById('modal-reply').style.display='none'; }

async function renderReply() {
    const { data } = await db.from('comments').select('*').eq('post_id',curPId).order('created_at',{ascending:true});
    const list = data||[];
    if (!list.length) { document.getElementById('reply-list').innerHTML='<div class="empty" style="padding:20px">还没有评论，来说第一句话吧</div>'; return; }
    document.getElementById('reply-list').innerHTML = list.map(c => {
        const isHost = curPostAuthorId && c.author_id === curPostAuthorId;
        const avS = c.author_id==='me' ? avStyle(my.name, my.avatar_url, 36) : `background:${avColor(c.author_name)};font-size:14px;`;
        const avC = c.author_id==='me' ? avContent(my.name, my.avatar_url) : esc((c.author_name||'?')[0]);
        return `<div style="display:flex;gap:10px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid #f2f2f2;">
            <div class="av" style="width:36px;height:36px;flex-shrink:0;${avS}">${avC}</div>
            <div>
                <div style="font-weight:bold;font-size:14px;">
                    ${esc(c.author_name)}${isHost ? '<span class="badge-host">楼主</span>' : ''}
                </div>
                <div style="font-size:14px;margin-top:3px;">${esc(c.content)}</div>
            </div>
        </div>`;
    }).join('');
}

async function submitReply() {
    const val = document.getElementById('reply-inp').value.trim();
    if (!val) return;
    const { error } = await db.from('comments').insert([{post_id:curPId, author_id:'me', author_name:my.name, content:val}]);
    if (error) { alert('评论失败：'+error.message); return; }
    document.getElementById('reply-inp').value='';
    renderReply();
}

window.onload = init;
