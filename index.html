<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简社交</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --pk: #FF6699; --pk-bg: #fff0f5; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: #fff; color: #0f1419; overflow-x: hidden; }

        /* ── auth ── */
        #auth-screen { position: fixed; inset: 0; background: linear-gradient(145deg,#FF6699,#FFB3CC); display: flex; align-items: center; justify-content: center; z-index: 999; }
        .auth-card { background: #fff; border-radius: 24px; padding: 28px 22px; width: 88%; max-width: 360px; box-shadow: 0 20px 60px rgba(255,102,153,.25); }
        .auth-logo { text-align: center; font-size: 26px; font-weight: 900; color: var(--pk); margin-bottom: 20px; letter-spacing: 1px; }
        .auth-tabs { display: flex; border-bottom: 2px solid #eee; margin-bottom: 20px; }
        .auth-tab { flex: 1; text-align: center; padding: 9px; cursor: pointer; font-weight: bold; color: #bbb; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: .2s; }
        .auth-tab.on { color: var(--pk); border-bottom-color: var(--pk); }
        .a-inp { width: 100%; padding: 11px 13px; border: 1.5px solid #eee; border-radius: 10px; font-size: 15px; margin-bottom: 10px; outline: none; transition: border .2s; }
        .a-inp:focus { border-color: var(--pk); }
        .a-btn { width: 100%; padding: 12px; background: var(--pk); color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 4px; }
        .a-err { color: #f44; font-size: 13px; margin-bottom: 8px; display: none; }
        .a-hint { font-size: 12px; color: #aaa; text-align: center; margin-top: 10px; }

        /* ── main app ── */
        #main-app { display: none; }
        .app { max-width: 600px; margin: 0 auto; min-height: 100vh; padding-bottom: 60px; border: 1px solid #eee; }
        .hd { padding: 14px 15px; border-bottom: 1px solid #eee; font-size: 20px; font-weight: 800; position: sticky; top: 0; background: rgba(255,255,255,.92); backdrop-filter: blur(10px); z-index: 10; display: flex; align-items: center; justify-content: space-between; }

        .av { border-radius: 50%; overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; background-size: cover; background-position: center; }

        .compose { padding: 15px; border-bottom: 1px solid #eee; display: flex; gap: 12px; }
        .compose-main { flex: 1; min-width: 0; }
        .c-inp { width: 100%; border: none; outline: none; font-size: 17px; resize: none; min-height: 48px; }
        .pre-grid { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .pre-wrap { position: relative; }
        .pre-thumb { width: 86px; height: 86px; object-fit: cover; border-radius: 10px; display: block; }
        .pre-del { position: absolute; top: 3px; right: 3px; background: rgba(0,0,0,.55); color: #fff; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px; }
        .c-tools { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }

        .post { border-bottom: 1px solid #eee; padding: 15px; display: flex; gap: 12px; transition: background .5s; }
        .post.hl { background: var(--pk-bg); }
        .post-body { flex: 1; min-width: 0; }
        .post-author { font-weight: 800; font-size: 15px; cursor: pointer; display: inline; }
        .post-author:hover { color: var(--pk); }
        .post-text { font-size: 15px; line-height: 1.5; margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
        .imgs-1 { margin-top: 10px; } .imgs-1 img { width: 100%; max-height: 360px; object-fit: cover; border-radius: 14px; border: 1px solid #f0f0f0; }
        .imgs-2,.imgs-3 { display: grid; gap: 3px; margin-top: 10px; border-radius: 14px; overflow: hidden; }
        .imgs-2 { grid-template-columns: 1fr 1fr; }
        .imgs-3 { grid-template-columns: 1fr 1fr; }
        .imgs-3 img:first-child { grid-column: span 2; height: 200px; }
        .imgs-2 img,.imgs-3 img { width: 100%; height: 180px; object-fit: cover; display: block; }
        .post-actions { display: flex; justify-content: space-between; margin-top: 12px; color: #536471; }
        .act { display: flex; align-items: center; gap: 4px; cursor: pointer; font-size: 13px; padding: 4px 2px; transition: color .2s; }
        .act svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }
        .act:hover { color: var(--pk); } .act.liked { color: var(--pk); } .act.del { color: #ddd; } .act.del:hover { color: #f44; }

        .profile-box { padding: 20px; text-align: center; border-bottom: 1px solid #eee; }
        .meta-info { font-size: 14px; color: var(--pk); margin: 12px 0; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .mtag { background: var(--pk-bg); padding: 5px 12px; border-radius: 12px; cursor: pointer; user-select: none; }
        .mtag:hover { filter: brightness(.95); }

        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; z-index: 1000; align-items: center; justify-content: center; }
        .menu-box { background: #fff; width: 84%; max-width: 320px; border-radius: 18px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
        .menu-hd { padding: 13px 16px; font-weight: bold; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; font-size: 15px; }
        .menu-back { color: var(--pk); cursor: pointer; font-size: 13px; min-width: 40px; }
        .menu-scroll { max-height: 370px; overflow-y: auto; }
        .menu-sect { padding: 5px 16px; font-size: 11px; color: #aaa; background: #f9f9f9; }
        .mi { padding: 13px 16px; text-align: center; border-bottom: 1px solid #f2f2f2; cursor: pointer; font-size: 15px; }
        .mi:hover { background: var(--pk-bg); } .mi.cancel { color: var(--pk); font-weight: bold; border-bottom: none; }

        .bnav { position: fixed; bottom: 0; width: 100%; max-width: 600px; display: flex; background: #fff; border-top: 1px solid #eee; height: 55px; z-index: 10; }
        .ni { flex: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #c0c8d0; transition: color .2s; position: relative; }
        .ni.on { color: var(--pk); } .ni svg { width: 26px; height: 26px; fill: currentColor; }
        .n-dot { position: absolute; top: 8px; right: 20%; width: 8px; height: 8px; background: #f44; border-radius: 50%; display: none; }

        .btn-pk { background: var(--pk); color: #fff; border: none; padding: 8px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .btn-ghost { background: #fff; border: 1px solid #ddd; padding: 6px 16px; border-radius: 20px; cursor: pointer; }
        .btn-blk { width: 100%; background: #111; color: #fff; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; }
        .ef { width: 100%; padding: 10px; border: 1px solid #eee; border-radius: 8px; font-size: 15px; margin-bottom: 10px; outline: none; }
        textarea.ef { resize: none; min-height: 70px; }

        .badge-host { background: var(--pk); color: #fff; font-size: 10px; padding: 1px 5px; border-radius: 4px; margin-left: 5px; vertical-align: middle; }

        .view { display: none; } .view.on { display: block; }
        .empty { padding: 40px; text-align: center; color: #bbb; font-size: 15px; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; z-index: 200; align-items: flex-end; }
        .modal-body { background: #fff; width: 100%; max-width: 600px; height: 82vh; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; margin: 0 auto; }
        .modal-hd { padding: 13px 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .modal-compose { display: flex; align-items: flex-end; gap: 10px; padding: 10px 15px; border-top: 1px solid #eee; flex-shrink: 0; }
        .modal-compose textarea { flex: 1; font-size: 15px; border: none; outline: none; resize: none; min-height: 40px; }

        #v-user { display: none; position: fixed; inset: 0; background: #fff; z-index: 150; max-width: 600px; left: 50%; transform: translateX(-50%); overflow-y: auto; padding-bottom: 60px; }

        .notif-row { padding: 14px 16px; border-bottom: 1px solid #f2f2f2; display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
        .notif-row.unread { background: var(--pk-bg); }
        .notif-row:hover { background: #f9f9f9; }
        .notif-icon { font-size: 22px; flex-shrink: 0; }
        .notif-text { font-size: 14px; line-height: 1.5; }
        .notif-time { font-size: 12px; color: #aaa; margin-top: 2px; }
    </style>
</head>
<body>

<script>
const SB_URL = 'https://podskdvqrhxvhnwylvsx.supabase.co';
const SB_KEY = 'sb_publishable_9Kow0JDI_jpqiWm4ne5Zjg_HlDA3wr8';
const db = supabase.createClient(SB_URL, SB_KEY);

let session = null;
let my = {};
let postImgs = [];
let likedPosts = new Set();
let followed = [];
let curPId = null, curPostAuthorId = null;
let selCountry = null;
let bdStep = 'year', bdY = null, bdM = null;
let viewingUid = null;

// ── auth helpers ──────────────────────────────────────
async function sha256(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function showTab(t) {
    document.getElementById('form-login').style.display = t==='login'?'block':'none';
    document.getElementById('form-reg').style.display  = t==='reg'?'block':'none';
    document.getElementById('tab-login').className = 'auth-tab'+(t==='login'?' on':'');
    document.getElementById('tab-reg').className  = 'auth-tab'+(t==='reg'?' on':'');
}

async function doLogin() {
    const username = document.getElementById('l-user').value.trim();
    const pw       = document.getElementById('l-pw').value;
    const err      = document.getElementById('l-err');
    err.style.display = 'none';
    if (!username || !pw) { err.innerText='请填写完整'; err.style.display='block'; return; }
    const hash = await sha256(pw);
    const { data } = await db.from('profiles').select('*').eq('username', username).eq('password_hash', hash).single();
    if (!data) { err.innerText='用户名或密码错误'; err.style.display='block'; return; }
    startSession(data);
}

async function doRegister() {
    const username = document.getElementById('r-user').value.trim();
    const name     = document.getElementById('r-name').value.trim();
    const pw       = document.getElementById('r-pw').value;
    const pw2      = document.getElementById('r-pw2').value;
    const err      = document.getElementById('r-err');
    err.style.display = 'none';
    if (!username || !name || !pw || !pw2) { err.innerText='请填写所有字段'; err.style.display='block'; return; }
    if (!/^[a-zA-Z0-9_]+$/.test(username)) { err.innerText='用户名仅限英文字母、数字和下划线'; err.style.display='block'; return; }
    if (pw.length < 6) { err.innerText='密码至少 6 位'; err.style.display='block'; return; }
    if (pw !== pw2) { err.innerText='两次密码不一致'; err.style.display='block'; return; }
    // check uniqueness
    const { data: ex1 } = await db.from('profiles').select('id').eq('id', username).maybeSingle();
    const { data: ex2 } = await db.from('profiles').select('id').eq('username', username).maybeSingle();
    if (ex1 || ex2) { err.innerText='该用户名已被使用，请换一个'; err.style.display='block'; return; }
    const hash = await sha256(pw);
    const { data, error } = await db.from('profiles').insert([{
        id: username, username, name, password_hash: hash,
        bio:'', region:'', constellation:'', birthday:'', avatar_url:''
    }]).select().single();
    if (error) { err.innerText='注册失败：'+error.message; err.style.display='block'; return; }
    startSession(data);
}

function startSession(profile) {
    session = profile;
    localStorage.setItem('session', JSON.stringify(profile));
    launchApp();
}

function logout() {
    session = null;
    localStorage.removeItem('session');

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function fmtBd(bd) {
    if (!bd) return '点击设生日';
    const [y,m,d] = bd.split('-').map(Number);
    return `${y}年${m}月${d}日`;
}

function fmtTime(ts) {
    if (!ts) return '';
    const diff = Date.now() - new Date(ts);
    if (diff < 60000) return '刚刚';
    if (diff < 3600000) return Math.floor(diff/60000)+'分钟前';
    if (diff < 86400000) return Math.floor(diff/3600000)+'小时前';
    const d = new Date(ts);
    return `${d.getMonth()+1}/${d.getDate()}`;
}

function renderImgs(raw) {
    if (!raw) return '';
    let a; try { a = JSON.parse(raw); } catch { a = [raw]; }
    if (!Array.isArray(a)) a = [a];
    a = a.filter(Boolean);
    if (!a.length) return '';
    if (a.length === 1) return `<div class="imgs-1"><img src="${esc(a[0])}"></div>`;
    if (a.length === 2) return `<div class="imgs-2">${a.map(s=>`<img src="${esc(s)}">`).join('')}</div>`;
    return `<div class="imgs-3">${a.slice(0,3).map(s=>`<img src="${esc(s)}">`).join('')}</div>`;
}

    return `<div class="post" id="post-${p.id}">
        <div class="av" style="width:46px;height:46px;cursor:pointer;${avStyle}" onclick="openUserView('${esc(p.author_id)}','${esc(p.author_name)}')">${esc(avText)}</div>

            </div>
        </div>
    </div>`;

async function loadFeed(type) {
    let q = db.from('posts').select('*').order('created_at',{ascending:false});
    if (type === 'me') {
        q = q.eq('author_id', my.id);
    } else if (type === 'follow') {
        const ids = [my.id, ...followed];
        q = q.in('author_id', ids);
    }
    const { data: posts } = await q;
    const { data: comms } = await db.from('comments').select('post_id');
    const cid = type==='me'?'list-mine':type==='follow'?'list-follow':'list-all';
    const container = document.getElementById(cid);
    if (!posts||!posts.length) { container.innerHTML='<div class="empty">暂无内容</div>'; return; }
    const cnt = {}; (comms||[]).forEach(c=>cnt[c.post_id]=(cnt[c.post_id]||0)+1);
    container.innerHTML = posts.map(p=>postCard(p, cnt[p.id]||0)).join('');
}

async function like(el) {
    const id       = Number(el.dataset.id);
    const authorId = el.dataset.author;
    const wasLiked = likedPosts.has(id);
    const cur      = Number(el.dataset.likes);
    if (wasLiked) { likedPosts.delete(id); el.classList.remove('liked'); }
    else          { likedPosts.add(id);    el.classList.add('liked'); }
    localStorage.setItem('liked_'+my.id, JSON.stringify([...likedPosts]));
    const next = wasLiked ? Math.max(0,cur-1) : cur+1;
    el.querySelector('span').innerText = next;
    el.dataset.likes = next;
    await db.from('posts').update({likes:next}).eq('id',id);
    if (!wasLiked && authorId !== my.id) {
        await db.from('notifications').insert([{ recipient_id:authorId, type:'like', sender_id:my.id, sender_name:my.name, post_id:id, message:'赞了你的帖子' }]);
    }
}

// ── images ────────────────────────────────────────────
function compress(file, maxPx=1000, q=.78) {
    return new Promise(res => {
        const img = new Image(), url = URL.createObjectURL(file);
        img.onload = () => {
            URL.revokeObjectURL(url);
            const s = Math.min(1, maxPx/Math.max(img.width,img.height));
            const cv = document.createElement('canvas');
            cv.width  = Math.round(img.width*s);
            cv.height = Math.round(img.height*s);
            cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
            res(cv.toDataURL('image/jpeg',q));
        };
        img.src = url;
    });
}

async function handleFiles(e) {
    const rem = 3 - postImgs.length;

    for (const f of Array.from(e.target.files).slice(0,rem)) postImgs.push(await compress(f));
    e.target.value = '';
    renderPreGrid();

function renderBd() {
    const titles={year:'选择出生年份',month:`${bdY}年 · 选择月份`,day:`${bdY}年${bdM}月 · 选择日`};
    document.getElementById('bd-title').innerText = titles[bdStep];

    if (bdStep==='year')  html = BD_YEARS.map(y=>`<div class="mi" onclick="bdYear(${y})">${y} 年</div>`).join('');
    else if (bdStep==='month') html = BD_MONTHS.map((m,i)=>`<div class="mi" onclick="bdMonth(${i+1})">${m}</div>`).join('');
    else html = Array.from({length:daysInMonth(bdY,bdM)},(_,i)=>i+1).map(d=>`<div class="mi" onclick="bdDay(${d})">${d} 日</div>`).join('');

async function openUserView(uid, uname) {
    if (uid===my.id) { switchNav('me'); return; }
    viewingUid = uid;
    const panel = document.getElementById('v-user');
    document.getElementById('u-hd-name').innerText = uname;
    document.getElementById('u-name').innerText = '加载中…';
    document.getElementById('u-posts').innerHTML = '<div class="empty">加载中…</div>';
    updateFBtn();
    panel.style.display='block';
    document.body.style.overflow='hidden';

    const { data:p } = await db.from('profiles').select('*').eq('id',uid).maybeSingle();
    const avEl = document.getElementById('u-av');
    if (p) {
        document.getElementById('u-name').innerText    = p.name||uname;
        document.getElementById('u-bio').innerText     = p.bio||'暂无简介';
        document.getElementById('u-city').innerText   = '📍 '+(p.region||'未设置');
        document.getElementById('u-const').innerText  = '✨ '+(p.constellation||'未设置');
        document.getElementById('u-birth').innerText  = '🎂 '+fmtBd(p.birthday);
        applyAv(avEl, p.name||uname, p.avatar_url, 80);
    } else {
        document.getElementById('u-name').innerText = uname;
        applyAv(avEl, uname, null, 80);
    }

    const { data:posts } = await db.from('posts').select('*').eq('author_id',uid).order('created_at',{ascending:false});
    const { data:comms } = await db.from('comments').select('post_id');
    if (!posts||!posts.length) { document.getElementById('u-posts').innerHTML='<div class="empty">TA 还没有发过帖子</div>'; return; }
    const cnt={}; (comms||[]).forEach(c=>cnt[c.post_id]=(cnt[c.post_id]||0)+1);
    document.getElementById('u-posts').innerHTML = posts.map(p=>postCard(p,cnt[p.id]||0)).join('');
}

function closeUserView() { document.getElementById('v-user').style.display='none'; document.body.style.overflow=''; viewingUid=null; }

function toggleFollow() {
    if (!viewingUid) return;
    const i = followed.indexOf(viewingUid);
    if (i>=0) followed.splice(i,1); else followed.push(viewingUid);
    localStorage.setItem('fol_'+my.id, JSON.stringify(followed));
    updateFBtn();
}

function updateFBtn() {
    const btn = document.getElementById('u-fbtn');
    const isF = followed.includes(viewingUid);
    btn.innerText = isF?'已关注':'关注';
    if (isF) { btn.style.cssText='font-size:13px;padding:5px 14px;background:#fff;color:var(--pk);border:1.5px solid var(--pk);border-radius:20px;cursor:pointer;'; }
    else     { btn.className='btn-pk'; btn.style.cssText='font-size:13px;padding:5px 14px;'; }
}

// ── reply ─────────────────────────────────────────────
function openReply(id, authorId) { curPId=id; curPostAuthorId=authorId; document.getElementById('modal-reply').style.display='flex'; renderReply(); }
function closeReply() { document.getElementById('modal-reply').style.display='none'; }

async function renderReply() {
    const { data } = await db.from('comments').select('*').eq('post_id',curPId).order('created_at',{ascending:true});
    const list = data||[];
    if (!list.length) { document.getElementById('reply-list').innerHTML='<div class="empty" style="padding:20px">还没有评论，来说第一句话吧</div>'; return; }
    document.getElementById('reply-list').innerHTML = list.map(c => {
        const isHost = curPostAuthorId && c.author_id===curPostAuthorId;
        const isMine = c.author_id===my.id;
        const avS = isMine
            ? (my.avatar_url?`background-image:url('${my.avatar_url}');background-size:cover;background-position:center;font-size:0;`:`background:${avColor(my.name)};font-size:14px;`)
            : `background:${avColor(c.author_name)};font-size:14px;`;
        const avC = isMine?(my.avatar_url?'':(my.name||'?')[0]):(c.author_name||'?')[0];
        return `<div style="display:flex;gap:10px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid #f2f2f2;">
            <div class="av" style="width:34px;height:34px;flex-shrink:0;${avS}">${esc(avC)}</div>
            <div><div style="font-weight:bold;font-size:14px;">${esc(c.author_name)}${isHost?'<span class="badge-host">楼主</span>':''}</div>
            <div style="font-size:14px;margin-top:3px;">${esc(c.content)}</div></div>
        </div>`;
    }).join('');
}

async function submitReply() {
    const val = document.getElementById('reply-inp').value.trim();
    if (!val) return;
    const { error } = await db.from('comments').insert([{ post_id:curPId, author_id:my.id, author_name:my.name, content:val }]);
    if (error) { alert('评论失败：'+error.message); return; }
    if (curPostAuthorId && curPostAuthorId !== my.id) {
        await db.from('notifications').insert([{ recipient_id:curPostAuthorId, type:'comment', sender_id:my.id, sender_name:my.name, post_id:curPId, message:'评论了你的帖子：'+val.slice(0,30) }]);
        checkNotifDot();
    }
    document.getElementById('reply-inp').value='';
    renderReply();
}

// ── bootstrap ─────────────────────────────────────────
window.onload = () => {
    try { session = JSON.parse(localStorage.getItem('session')||'null'); } catch {}
    if (session) launchApp();
    else document.getElementById('auth-screen').style.display='flex';
};
</script>
