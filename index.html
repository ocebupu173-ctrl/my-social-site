<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简社交 V5.6</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #FF6699; --primary-bg: #fff0f5; }
        body { margin: 0; font-family: -apple-system, sans-serif; background: #fff; color: #0f1419; overflow-x: hidden; }
        .app-container { max-width: 600px; margin: 0 auto; min-height: 100vh; padding-bottom: 60px; border: 1px solid #eee; position: relative; }
        .header { padding: 15px; border-bottom: 1px solid #eee; font-size: 20px; font-weight: 800; position: sticky; top: 0; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); z-index: 10; display: flex; justify-content: space-between; align-items: center; }

        .compose { padding: 15px; border-bottom: 1px solid #eee; display: flex; gap: 12px; }
        .avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--primary-bg); flex-shrink: 0; }
        .compose-main { flex: 1; min-width: 0; }
        .compose-input { width: 100%; border: none; outline: none; font-size: 18px; resize: none; min-height: 50px; box-sizing: border-box; }
        .compose-preview { max-height: 160px; width: auto; max-width: 60%; border-radius: 12px; margin-top: 10px; object-fit: contain; display: none; }
        .compose-tools { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }

        .post { border-bottom: 1px solid #eee; padding: 15px; display: flex; gap: 12px; transition: background 0.6s; }
        .post.highlighted { background: var(--primary-bg); }
        .post-body { flex: 1; min-width: 0; }
        .post-meta { font-weight: 800; font-size: 15px; }
        .post-content { font-size: 15px; line-height: 1.5; margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
        .post-img { width: 100%; max-height: 360px; object-fit: cover; border-radius: 14px; margin-top: 10px; border: 1px solid #f0f0f0; display: block; }
        .post-actions { display: flex; justify-content: space-between; margin-top: 12px; color: #536471; }
        .action { display: flex; align-items: center; gap: 4px; cursor: pointer; transition: color 0.2s; font-size: 13px; padding: 4px 2px; }
        .action svg { width: 17px; height: 17px; fill: currentColor; flex-shrink: 0; }
        .action:hover { color: var(--primary); }
        .action.liked { color: var(--primary); }
        .action.del { color: #ccc; }
        .action.del:hover { color: #f44; }

        .profile-box { padding: 20px; text-align: center; border-bottom: 1px solid #eee; }
        .meta-info { font-size: 14px; color: var(--primary); margin: 12px 0; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .meta-tag { background: var(--primary-bg); padding: 5px 12px; border-radius: 12px; cursor: pointer; user-select: none; }
        .meta-tag:hover { filter: brightness(0.96); }

        .popup-menu { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; z-index: 1000; align-items: center; justify-content: center; }
        .menu-box { background: #fff; width: 84%; max-width: 320px; border-radius: 18px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .menu-hd { padding: 14px 16px; font-weight: bold; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; font-size: 15px; }
        .menu-back { color: var(--primary); cursor: pointer; font-size: 13px; min-width: 40px; }
        .menu-section { padding: 6px 16px; font-size: 11px; color: #aaa; background: #f9f9f9; text-align: left; letter-spacing: 0.5px; text-transform: uppercase; }
        .menu-scroll { max-height: 360px; overflow-y: auto; }
        .menu-item { padding: 14px 16px; text-align: center; border-bottom: 1px solid #f2f2f2; cursor: pointer; font-size: 15px; }
        .menu-item:last-child { border-bottom: none; }
        .menu-item:hover { background: var(--primary-bg); }
        .menu-item.cancel { color: var(--primary); font-weight: bold; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 600px; display: flex; background: #fff; border-top: 1px solid #eee; height: 55px; }
        .nav-item { flex: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #c0c8d0; transition: color 0.2s; }
        .nav-item.active { color: var(--primary); }
        .nav-item svg { width: 26px; height: 26px; fill: currentColor; }

        .btn-primary { background: var(--primary); color: #fff; border: none; padding: 8px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .btn-ghost { background: #fff; border: 1px solid #ddd; padding: 6px 16px; border-radius: 20px; cursor: pointer; }
        .btn-block { width: 100%; background: #111; color: #fff; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; box-sizing: border-box; }
        .edit-field { width: 100%; padding: 10px; border: 1px solid #eee; border-radius: 8px; box-sizing: border-box; font-size: 15px; margin-bottom: 10px; }
        textarea.edit-field { resize: none; min-height: 70px; }

        .view { display: none; }
        .view.active { display: block; }
        .empty-tip { padding: 40px; text-align: center; color: #bbb; font-size: 15px; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; z-index: 200; align-items: flex-end; }
        .modal-body { background: #fff; width: 100%; max-width: 600px; height: 80vh; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; margin: 0 auto; }
        .modal-hd { padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .modal-compose { display: flex; align-items: flex-end; gap: 10px; padding: 10px 15px; border-top: 1px solid #eee; flex-shrink: 0; }
        .modal-compose textarea { flex: 1; font-size: 16px; border: none; outline: none; resize: none; min-height: 40px; }
    </style>
</head>

// ── PROFILE ──────────────────────────────────────────
function renderProfile() {
    document.getElementById('p-name').innerText = my.name || '探索者';
    document.getElementById('p-bio').innerText = my.bio || '暂无个人简介';
    document.getElementById('p-city').innerText = '📍 ' + (my.city || '点击选城市');
    document.getElementById('p-const').innerText = '✨ ' + (my.constellation || '点击选星座');
    document.getElementById('p-birth').innerText = '🎂 ' + formatBd(my.birthday);
}

function openEditPanel() {
    document.getElementById('i-name').value = my.name || '';
    document.getElementById('i-bio').value = my.bio || '';
    document.getElementById('edit-panel').style.display = 'block';
}

async function saveProfile() {
    const up = { id:'me', name: document.getElementById('i-name').value.trim() || my.name, bio: document.getElementById('i-bio').value.trim() };
    await db.from('profiles').upsert([up]);
    my = { ...my, ...up };
    renderProfile();
    document.getElementById('edit-panel').style.display = 'none';
}

// ── FEED ─────────────────────────────────────────────

            <div class="post-meta">${escapeHtml(p.author_name)}</div>
            <div class="post-content">${escapeHtml(p.content)}</div>
            ${p.image_url ? `<img src="${escapeHtml(p.image_url)}" class="post-img">` : ''}
            <div class="post-actions">
                <div class="action" data-id="${p.id}" data-likes="${p.likes}" onclick="like(this)">
                    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    <span>${p.likes}</span>
                </div>
                <div class="action" onclick="openReply(${p.id})">
                    <svg viewBox="0 0 24 24"><path d="M21.99 4c0-1.1-.89-2-1.99-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4-.01-18z"/></svg>
                    <span>${cCount}</span>
                </div>
                <div class="action" onclick="sharePost(${p.id})">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
                    <span>分享</span>
                </div>
                ${isOwn ? `<div class="action del" onclick="deletePost(${p.id})">
                    <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                    <span>删除</span>
                </div>` : ''}
            </div>
        </div>
    </div>`;
}

async function loadFeed(type) {
    let q = db.from('posts').select('*').order('created_at', { ascending: false });
    if (type === 'follow' || type === 'me') q = q.eq('author_id', 'me');
    const { data: posts } = await q;
    const { data: comms } = await db.from('comments').select('post_id');
    const containerId = type === 'me' ? 'list-mine' : type === 'follow' ? 'list-follow' : 'list-all';
    const container = document.getElementById(containerId);
    if (!posts || !posts.length) { container.innerHTML = '<div class="empty-tip">暂无内容</div>'; return; }
    const counts = {};
    (comms || []).forEach(c => counts[c.post_id] = (counts[c.post_id] || 0) + 1);
    container.innerHTML = posts.map(p => postCard(p, counts[p.id] || 0)).join('');
}

async function like(el) {
    el.classList.toggle('liked');
    const isAdd = el.classList.contains('liked');
    const id = Number(el.dataset.id);
    const cur = Number(el.dataset.likes);
    const next = isAdd ? cur + 1 : Math.max(0, cur - 1);
    el.querySelector('span').innerText = next;
    el.dataset.likes = next;
    await db.from('posts').update({ likes: next }).eq('id', id);
}

async function deletePost(id) {
    if (!confirm('确定删除这条动态吗？')) return;
    await db.from('comments').delete().eq('post_id', id);
    await db.from('posts').delete().eq('id', id);
    const el = document.getElementById('post-' + id);
    if (el) el.remove();
}

async function sharePost(id) {
    const url = `${location.origin}${location.pathname}?post=${id}`;
    try { await navigator.clipboard.writeText(url); alert('链接已复制！分享给朋友，点击可直接跳转到这条帖子。'); }
    catch { prompt('复制以下链接：', url); }
}

async function publish() {
    const txt = document.getElementById('inp-text').value.trim();
    if (!txt && !postImg) return;
    await db.from('posts').insert([{ author_id:'me', author_name:my.name, content:txt, image_url:postImg, likes:0 }]);
    location.reload();
}

// ── CONSTELLATION ────────────────────────────────────
function openConstMenu() { document.getElementById('const-menu').style.display = 'flex'; }
function closeConstMenu() { document.getElementById('const-menu').style.display = 'none'; }
async function selectConst(name) {
    await db.from('profiles').upsert([{ id:'me', constellation:name }]);
    my.constellation = name; renderProfile(); closeConstMenu();
}

// ── CITY (2-step) ────────────────────────────────────
function openCityMenu() { selCountry = null; showCountries(); document.getElementById('city-menu').style.display = 'flex'; }
function closeCityMenu() { document.getElementById('city-menu').style.display = 'none'; }

function showCountries() {
    selCountry = null;
    document.getElementById('city-title').innerText = '选择国家';
    document.getElementById('city-back').style.display = 'none';
    document.getElementById('city-list').innerHTML =
        COUNTRIES.map(c => `<div class="menu-item" onclick="showCities('${c.name}')">${c.flag} ${c.name}</div>`).join('') +
        `<div class="menu-item cancel" onclick="closeCityMenu()">取消</div>`;
}

function showCities(countryName) {
    selCountry = COUNTRIES.find(c => c.name === countryName);
    document.getElementById('city-title').innerText = selCountry.flag + ' ' + selCountry.name;
    document.getElementById('city-back').style.display = 'block';
    document.getElementById('city-list').innerHTML =
        selCountry.cities.map(city => `<div class="menu-item" onclick="selectCity('${city}')">${city}</div>`).join('') +
        `<div class="menu-item cancel" onclick="closeCityMenu()">取消</div>`;
}

async function selectCity(city) {
    const val = selCountry ? selCountry.name + ' · ' + city : city;
    await db.from('profiles').upsert([{ id:'me', city:val }]);
    my.city = val; renderProfile(); closeCityMenu();
}

// ── BIRTHDAY (3-step) ────────────────────────────────
function openBdMenu() { bdStep = 'year'; bdYear = null; bdMonth = null; renderBdMenu(); document.getElementById('bd-menu').style.display = 'flex'; }
function closeBdMenu() { document.getElementById('bd-menu').style.display = 'none'; }

function bdBack() {
    if (bdStep === 'day') { bdStep = 'month'; bdMonth = null; }
    else { bdStep = 'year'; bdYear = null; }
    renderBdMenu();
}

function renderBdMenu() {
    const titles = { year:'选择出生年份', month:`${bdYear}年 · 选择月份`, day:`${bdYear}年${bdMonth}月 · 选择日` };
    document.getElementById('bd-title').innerText = titles[bdStep];
    document.getElementById('bd-back').style.display = bdStep === 'year' ? 'none' : 'block';
    let html = '';
    if (bdStep === 'year') {
        html = BD_YEARS.map(y => `<div class="menu-item" onclick="bdPickYear(${y})">${y} 年</div>`).join('');
    } else if (bdStep === 'month') {
        html = BD_MONTHS.map((m, i) => `<div class="menu-item" onclick="bdPickMonth(${i+1})">${m}</div>`).join('');
    } else {
        html = Array.from({length: daysInMonth(bdYear, bdMonth)}, (_, i) => i + 1)
            .map(d => `<div class="menu-item" onclick="bdPickDay(${d})">${d} 日</div>`).join('');
    }
    document.getElementById('bd-list').innerHTML = html + `<div class="menu-item cancel" onclick="closeBdMenu()">取消</div>`;
}

function bdPickYear(y) { bdYear = y; bdStep = 'month'; renderBdMenu(); }
function bdPickMonth(m) { bdMonth = m; bdStep = 'day'; renderBdMenu(); }
async function bdPickDay(d) {
    const val = `${bdYear}-${String(bdMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    await db.from('profiles').upsert([{ id:'me', birthday:val }]);
    my.birthday = val; renderProfile(); closeBdMenu();
}

// ── NAV ──────────────────────────────────────────────
function switchNav(v) {
    document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    const views = { home:'v-home', follow:'v-follow', msg:'v-msg', me:'v-me' };
    const titles = { home:'首页', follow:'动态', msg:'通知', me:'个人主页' };
    document.getElementById(views[v]).classList.add('active');
    document.getElementById('nav-' + v).classList.add('active');
    document.getElementById('title').innerText = titles[v];
    if (v === 'follow') loadFeed('follow');
    if (v === 'me') loadFeed('me');
}

// ── IMAGE ─────────────────────────────────────────────
function handleFile(e) {
    const r = new FileReader();
    r.onload = ev => {
        postImg = ev.target.result;
        const img = document.getElementById('pre-post');
        img.src = postImg; img.style.display = 'block';
    };
    r.readAsDataURL(e.target.files[0]);
}

// ── REPLY ─────────────────────────────────────────────
function openReply(id) { curPId = id; document.getElementById('modal-reply').style.display = 'flex'; renderReply(); }
function closeReply() { document.getElementById('modal-reply').style.display = 'none'; }

async function renderReply() {
    const { data } = await db.from('comments').select('*').eq('post_id', curPId).order('created_at', { ascending: true });
    const list = data || [];
    document.getElementById('reply-list').innerHTML = list.length
        ? list.map(c => `<div style="margin-bottom:15px;border-bottom:1px solid #eee;padding-bottom:10px">
            <div style="font-weight:bold;font-size:14px">${escapeHtml(c.author_name)}</div>
            <div style="font-size:14px;margin-top:4px">${escapeHtml(c.content)}</div>
          </div>`).join('')
        : '<div class="empty-tip" style="padding:20px">还没有评论，来说第一句话吧</div>';
}

async function submitReply() {
    const val = document.getElementById('reply-inp').value.trim();
    if (!val) return;
    await db.from('comments').insert([{ post_id:curPId, author_id:'me', author_name:my.name, content:val }]);
    document.getElementById('reply-inp').value = '';
    renderReply();
}

window.onload = init;
</script>
</body>
